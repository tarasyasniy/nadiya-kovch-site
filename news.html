<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>News | Nadiya Kovch</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--text:#14304F;--accent:#2A74B8;--a100:#EAF4FB;--a700:#1A4F82;--n100:#F3F8FC;--n200:#DCE7F1;--n300:#C3D4E4;--n700:#44607D;--h:"Cormorant Garamond",Georgia,serif;--b:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--b);font-size:17px;line-height:1.6}
a{color:var(--a700)}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--n200);z-index:5}
.w{max-width:820px;margin:0 auto;padding:0 22px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:76px}
.bar img{height:56px;display:block}
.lang{display:flex;gap:4px;background:#DCEEF8;border-radius:999px;padding:4px}
.lang button{cursor:pointer;border:0;border-radius:999px;padding:6px 13px;font:600 13px var(--b);background:transparent;color:var(--a700)}
.lang button[aria-pressed=true]{background:var(--accent);color:#fff}
main{padding:36px 0 80px}
h1{font-family:var(--h);font-weight:600;font-size:clamp(32px,5vw,46px);line-height:1.1;margin:0 0 12px}
.nk-disc{color:var(--n700);font-size:14.5px}
.nk-list{display:grid;gap:16px;margin-top:24px}
.nk-card2{display:grid;gap:6px;padding:22px;background:var(--n100);border-radius:20px;text-decoration:none;color:var(--text)}
.nk-card2:hover{background:var(--a100)}
.nk-card2 strong{font-family:var(--h);font-size:25px;line-height:1.2;font-weight:600}
.nk-nr-meta{font-size:13px;font-weight:600;color:var(--n700);text-transform:uppercase;letter-spacing:.04em}
.nk-nr-sum{color:var(--n700);font-size:15.5px}
.nk-more{font-weight:600;color:var(--a700);font-size:15px}
.nk-back{display:inline-block;margin-bottom:18px;font-weight:600;text-decoration:none}
.nk-art h1{margin-top:6px}
.nk-lead{font-size:19px;color:var(--n700)}
.nk-art h3{font-family:var(--h);font-size:24px;margin:28px 0 6px}
</style>
</head>
<body>
<header><div class="w bar"><a href="home-test.html"><img src="assets/nadiya-logo.jpg" alt="Nadiya-ye.com"></a>
<div class="lang" role="group" aria-label="Language"><button type="button" data-l="en">EN</button><button type="button" data-l="uk">UA</button><button type="button" data-l="ru">RU</button></div></div></header>
<main><div class="w" id="nk-news-app"></div></main>
<script src="news.js"></script>
</body>
</html>
