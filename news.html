<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>News | Nadiya Kovch</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#121212;--muted:#4A4F57;--soft:#8A9099;--rule:#DCDCDC;--paper:#FFFFFF;--tint:#F5F5F2;--h:"Playfair Display",Georgia,"Times New Roman",serif;--b:"Libre Franklin",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--b);font-size:20px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--ink)}
header.top{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--rule);z-index:5}
.w{max-width:1120px;margin:0 auto;padding:0 20px}
.bar{display:flex;align-items:center;gap:18px;height:72px}
.bar img{height:50px;display:block;flex:none}
.nk-nav{flex:1;display:flex;gap:22px;justify-content:center;overflow-x:auto;white-space:nowrap;scrollbar-width:none;font-weight:600;font-size:15px}
.nk-nav::-webkit-scrollbar{display:none}
.nk-nav a{text-decoration:none;color:var(--muted);padding:6px 0;border-bottom:2px solid transparent}
.nk-nav a:hover{color:var(--ink);border-bottom-color:var(--ink)}
.nk-menu-t{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
.nk-burger{display:none}
.lang{display:flex;gap:4px;background:var(--tint);border-radius:4px;padding:4px;flex:none}
.lang button{cursor:pointer;border:0;border-radius:3px;padding:7px 12px;font:700 14px var(--b);background:transparent;color:var(--ink)}
.lang button[aria-pressed=true]{background:var(--ink);color:#fff}
@media(max-width:859px){
 .bar{flex-wrap:wrap;height:auto;padding:10px 0;gap:8px}
 .bar img{height:44px}
 .lang{order:2;margin-left:auto;padding:3px;gap:2px}
 .lang button{padding:5px 9px;font-size:12px}
 .nk-burger{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;order:3;width:42px;height:42px;cursor:pointer}
 .nk-burger span{display:block;width:22px;height:2px;background:var(--ink);border-radius:2px}
 .nk-nav{display:none !important}
 .nk-menu-t:checked ~ .nk-nav{display:flex !important;position:absolute;top:100%;right:0;left:auto;width:70%;order:5;flex-direction:column;gap:0 !important;margin:0 !important;padding:6px 0 !important;background:#fff;border-left:1px solid var(--rule-x,#DCE7F1);border-bottom:1px solid var(--rule-x,#DCE7F1);box-shadow:0 14px 28px rgba(20,48,79,.16);z-index:30}
 .nk-nav a{display:block;padding:14px 20px;font-size:17px;border-bottom:1px solid var(--rule);border-left:0}
}
main{padding:28px 0 60px}
h1{font-family:var(--h);font-weight:800;font-size:clamp(34px,6vw,58px);line-height:1.08;margin:6px 0 16px;letter-spacing:-.01em}
h2{font-family:var(--h);font-weight:700;font-size:30px;margin:0 0 12px}
h3,.nk-h3{font-family:var(--b);font-size:14px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin:40px 0 10px;color:var(--muted)}
h4{font-family:var(--b);font-size:15px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 10px}
p{margin:0 0 20px}
.nk-foot{font-size:12.5px;line-height:1.5;color:var(--soft);border-top:1px solid var(--rule);padding-top:14px;margin:48px auto 0;max-width:780px;opacity:.85}
.nk-kicker{font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.nk-lead{font-family:var(--h);font-size:clamp(23px,3vw,29px);line-height:1.45;color:#2B2B2B;font-weight:500;margin:0 0 26px;text-align:justify;hyphens:auto}
.nk-back{display:inline-block;margin:6px 0 18px;font-weight:700;font-size:16px;text-decoration:none;border-bottom:2px solid var(--ink)}
/* list page */
.nk-mast{border-bottom:3px double var(--ink);padding-bottom:18px;margin-bottom:26px}
.nk-mast-date{font-size:14px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.nk-mast h1{font-size:clamp(40px,7vw,68px)}
.nk-grid{display:grid;gap:26px 28px;grid-template-columns:1fr}
.nk-tile{display:flex;flex-direction:column;gap:10px;text-decoration:none;padding-top:14px;background:#fff}
.nk-tile-art svg{width:100%;height:auto;display:block;border-radius:2px}
.nk-tile strong{font-family:var(--h);font-size:27px;line-height:1.18;font-weight:700}
.nk-tile-sum{font-size:20px;color:var(--muted);line-height:1.5;text-align:justify;hyphens:auto}
.nk-more{font-weight:700;font-size:16px}
.nk-tile:hover strong{text-decoration:underline}
@media(min-width:760px){
 .nk-grid{grid-template-columns:1fr 1fr}
 .nk-tile-lead{grid-column:1/-1;display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:center}
 .nk-tile-lead .nk-tile-art{grid-row:1/-1}
 .nk-tile-lead strong{font-size:44px}
}
@media(min-width:1000px){.nk-grid{grid-template-columns:1fr 1fr 1fr}.nk-tile-lead{grid-column:1/-1}}
/* article base: a tinted backdrop, the body sits on it */
.nk-art{position:relative;padding:28px 0 8px;background-repeat:repeat,no-repeat}
.nk-art>*:not(.nk-foot){max-width:100%}
.nk-art h1,.nk-art .nk-lead,.nk-top,.nk-p,.nk-ol,.nk-src,.nk-cols2,.nk-body2{max-width:740px}
.nk-p{font-size:22px;line-height:1.7;text-align:justify;hyphens:auto}
.nk-first::first-letter{font-family:var(--h);float:left;font-size:4.4em;line-height:.9;padding:6px 10px 0 0;font-weight:800}
.nk-src{list-style:none;padding:0;margin:0}
.nk-src li{margin:0 0 8px}
.nk-src a{font-size:17px;text-underline-offset:3px}
.nk-art svg{display:block;height:auto}
/* hero: colour band, smaller art */
.nk-band{display:grid;gap:18px;padding:28px 22px;color:#fff;border-radius:2px;margin-bottom:26px;align-items:center}
.nk-band h1{color:#fff;font-size:clamp(34px,6vw,62px)}
.nk-band .nk-kicker{color:#fff;opacity:.9}
.nk-band-art{max-width:200px;justify-self:center;width:100%}
.nk-band-art svg{width:100%;border-radius:2px}
@media(min-width:760px){.nk-band{grid-template-columns:1fr 200px;padding:40px 44px}}
/* centered */
.nk-center{text-align:center;max-width:760px;margin:0 auto 26px}
.nk-center h1{margin:10px 0 14px}
.nk-center .nk-lead{margin:0 auto}
.nk-center-art{max-width:300px;margin:0 auto 22px}
.nk-center-art svg{width:100%;border-radius:4px}
.nk-center-body{max-width:700px;margin:0 auto;text-align:left}
.nk-centered .nk-center .nk-kicker{display:inline-block;padding:4px 12px;background:#fff;border-radius:999px}
/* columns: art top right, body in two columns */
.nk-col-top{display:grid;gap:22px;align-items:center;margin-bottom:20px}
.nk-col-art{max-width:260px}
.nk-col-art svg{width:100%;border-radius:4px}
.nk-cols2{column-count:1;column-gap:44px;padding-top:18px}
@media(min-width:760px){.nk-col-top{grid-template-columns:1fr 240px}.nk-cols2{column-count:2;max-width:100%}}
/* steps */
.nk-steps-art{max-width:520px;margin:6px 0 24px}
.nk-steps-art svg{width:100%;border-radius:4px}
.nk-ol{list-style:none;padding:0;margin:0 0 10px;counter-reset:s}
.nk-ol li{display:grid;grid-template-columns:44px 1fr;gap:14px;padding:18px 0;border-top:1px solid var(--rule);align-items:start}
.nk-num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 18px var(--b)}
.nk-ol p{margin:0;font-size:21px;text-align:justify;hyphens:auto}
/* facts two-column */
.nk-two{display:grid;gap:34px}
.nk-box{background:#fff;padding:22px 22px 26px;align-self:start;box-shadow:0 1px 0 rgba(0,0,0,.06),0 10px 30px rgba(20,48,79,.08)}
.nk-box-art svg{width:100%;border-radius:4px;margin-bottom:16px}
.nk-box ul{margin:0;padding:0 0 0 18px}
.nk-box li{margin-bottom:10px;font-size:19px;text-align:justify}
@media(min-width:900px){.nk-two{grid-template-columns:1.25fr 1fr}}
/* compare */
.nk-cmp-art{max-width:460px;margin:6px 0 24px}
.nk-cmp-art svg{width:100%;border-radius:4px}
.nk-cols{display:grid;gap:20px;margin:6px 0 26px}
.nk-col{background:#fff;padding:22px;box-shadow:0 10px 30px rgba(20,48,79,.08)}
.nk-col h2{font-size:28px}
.nk-col ul{margin:0;padding-left:20px}
.nk-col li{margin-bottom:12px;font-size:20px;text-align:justify}
@media(min-width:760px){.nk-cols{grid-template-columns:1fr 1fr}}
/* brief: newspaper */
.nk-rule{height:8px;width:72px;margin-bottom:14px}
.nk-brief-art{max-width:100%;margin:6px 0 24px}
.nk-brief-art svg{width:100%;border-radius:2px}
.nk-body2 p{font-size:22px;text-align:justify;hyphens:auto}
@media(min-width:900px){.nk-body2{column-count:2;column-gap:44px;max-width:900px}.nk-body2 p{break-inside:avoid-column}}
@media(max-width:600px){body{font-size:20px}.nk-p,.nk-body2 p{font-size:20px}.nk-tile-sum{font-size:19px}.w{padding:0 16px}main{padding-top:20px}}
</style>
</head>
<body>
<header class="top"><div class="w bar"><a href="index.html#top"><img src="assets/nadiya-logo.jpg" alt="Nadiya-ye.com"></a>
<input type="checkbox" id="nk-menu-t" class="nk-menu-t" aria-label="Menu"><label for="nk-menu-t" class="nk-burger" aria-label="Menu"><span></span><span></span><span></span></label>
<nav class="nk-nav" id="nk-news-nav" aria-label="Main" onclick="if(event.target.tagName==='A')document.getElementById('nk-menu-t').checked=false"></nav>
<div class="lang" role="group" aria-label="Language"><button type="button" data-l="en">EN</button><button type="button" data-l="uk">UA</button><button type="button" data-l="ru">RU</button></div></div></header>
<main><div class="w" id="nk-news-app"></div></main>
<footer class="w" style="padding:0 20px 36px"><p id="nk-news-foot" style="font-size:12.5px;color:#8A9099;max-width:780px;margin:0 auto;border-top:1px solid #DCDCDC;padding-top:14px"></p></footer>
<script src="news.js"></script>
</body>
</html>
